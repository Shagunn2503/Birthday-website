<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎂</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@600;700&family=DM+Sans:wght@500;700&family=Patrick+Hand&display=swap');

:root{
  --cream:#FFF1D6; --red:#D94F4F; --green:#4F7C6B;
  --yellow:#F2B84B; --brown:#302B27; --pink:#E98EA5;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--brown);
  font-family:'DM Sans',sans-serif;
  background-color:var(--cream);
  background-image:radial-gradient(#F2B84B 2px,transparent 2px);
  background-size:32px 32px;
  overflow-x:hidden;
}
.page{max-width:1000px;margin:auto;padding:28px 18px 70px;text-align:center}
.sticker{
  display:inline-block;padding:8px 18px;background:var(--yellow);
  border:3px solid var(--brown);border-radius:8px;
  box-shadow:4px 5px 0 var(--brown);font:22px 'Patrick Hand';
  transform:rotate(-3deg);animation:stickerFloat 2.8s ease-in-out infinite;
}
@keyframes stickerFloat{50%{transform:rotate(3deg) translateY(-5px)}}
h1{
  margin:22px 0 5px;font:700 clamp(42px,8vw,80px)/.95 'Bodoni Moda';
  color:var(--red);text-shadow:4px 4px 0 #fff;
  animation:titlePop .8s cubic-bezier(.2,1.5,.4,1);
}
@keyframes titlePop{from{opacity:0;transform:scale(.65) rotate(-4deg)}to{opacity:1;transform:none}}
.subtitle{font:27px 'Patrick Hand';margin:0 0 22px}

.cake-area{max-width:700px;margin:auto}
.cake{
  height:450px;position:relative;margin:auto;
  animation:cakeBounce 3s ease-in-out infinite;
}
@keyframes cakeBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.tier{
  position:absolute;left:50%;transform:translateX(-50%);
  border:4px solid var(--brown);border-radius:18px 18px 28px 28px;
  box-shadow:0 8px 0 rgba(48,43,39,.16);
}
.tier1{width:88%;height:135px;bottom:18px;background:#F2B84B}
.tier2{width:68%;height:112px;bottom:128px;background:#E98EA5}
.tier3{width:48%;height:92px;bottom:220px;background:#F7D99C}

.tier:before{
  content:"";position:absolute;left:4%;right:4%;top:-16px;height:31px;
  border:4px solid var(--brown);border-radius:50%;background:#FFF7E7;
}
.tier:after{
  content:"✦  •  ✦  •  ✦";position:absolute;left:0;right:0;bottom:28px;
  font-size:23px;letter-spacing:12px;color:var(--brown);
}

.candle-row{
  position:absolute;z-index:5;left:50%;bottom:312px;
  transform:translateX(-50%);display:flex;gap:15px;align-items:flex-end;
}
.candle{
  width:18px;height:70px;border:3px solid var(--brown);border-radius:7px 7px 4px 4px;
  background:repeating-linear-gradient(135deg,var(--red) 0 10px,#FFF1D6 10px 20px);
  animation:candleWiggle 1.4s ease-in-out infinite;
}
.candle:nth-child(even){background:repeating-linear-gradient(135deg,var(--green) 0 10px,#FFF1D6 10px 20px);animation-delay:.2s}
@keyframes candleWiggle{50%{transform:rotate(3deg)}}

.flame{
  position:absolute;width:19px;height:27px;top:-31px;left:50%;
  transform:translateX(-50%);border:3px solid var(--brown);
  border-radius:55% 45% 60% 40%;background:var(--yellow);
  animation:flame .45s ease-in-out infinite alternate;
}
@keyframes flame{
  from{transform:translateX(-50%) scale(.85) rotate(-5deg)}
  to{transform:translateX(-50%) scale(1.08) rotate(6deg)}
}
.blown .flame{animation:blowOut .45s forwards;pointer-events:none}
@keyframes blowOut{to{opacity:0;transform:translate(-50%,-25px) scale(.1)}}

.blow-btn{
  border:3px solid var(--brown);border-radius:18px;
  background:var(--red);color:white;padding:15px 34px;
  font:700 22px 'DM Sans';box-shadow:6px 7px 0 var(--brown);
  cursor:pointer;transition:.15s;
}
.blow-btn:hover{transform:translateY(-3px)}
.blow-btn:active{transform:translate(4px,5px);box-shadow:2px 2px 0 var(--brown)}
.blow-btn:disabled{opacity:.65;cursor:default}
.hint{font:21px 'Patrick Hand';margin:12px}

.gifts-section{
  margin-top:35px;padding:28px 16px 38px;border:4px solid var(--brown);
  border-radius:28px;background:rgba(255,255,255,.28);
  box-shadow:8px 9px 0 rgba(48,43,39,.14);
  opacity:0;transform:translateY(40px) scale(.96);pointer-events:none;
}
.gifts-section.show{pointer-events:auto;animation:sectionIn .8s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes sectionIn{to{opacity:1;transform:none}}
.gift-title{font:700 clamp(34px,6vw,55px) 'Bodoni Moda';color:var(--green);margin:0 0 30px}
.gifts{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;max-width:820px;margin:auto}
.gift{background:none;border:0;cursor:pointer;min-height:190px;transition:.2s}
.gift:hover{transform:translateY(-10px) rotate(-3deg)}
.gift:nth-child(even):hover{transform:translateY(-10px) rotate(3deg)}
.box{
  width:135px;aspect-ratio:1;margin:auto;position:relative;
  border:4px solid var(--brown);border-radius:10px;
  background:var(--red);box-shadow:6px 7px 0 var(--brown);
}
.gift:nth-child(2) .box{background:var(--green)}
.gift:nth-child(3) .box{background:var(--yellow)}
.gift:nth-child(4) .box{background:var(--pink)}
.ribbon-v{position:absolute;top:0;bottom:0;left:42%;width:18%;background:#FFF1D6;border-left:3px solid var(--brown);border-right:3px solid var(--brown)}
.ribbon-h{position:absolute;left:0;right:0;top:42%;height:18%;background:#FFF1D6;border-top:3px solid var(--brown);border-bottom:3px solid var(--brown)}
.bow{position:absolute;top:-27px;left:50%;transform:translateX(-50%);width:76px;height:42px}
.bow:before,.bow:after{content:"";position:absolute;top:3px;width:39px;height:31px;background:var(--yellow);border:3px solid var(--brown);border-radius:50%}
.bow:before{left:0;transform:rotate(-25deg)} .bow:after{right:0;transform:rotate(25deg)}
.gift:nth-child(2) .bow:before,.gift:nth-child(2) .bow:after{background:var(--red)}
.gift:nth-child(3) .bow:before,.gift:nth-child(3) .bow:after{background:var(--green)}
.gift:nth-child(4) .bow:before,.gift:nth-child(4) .bow:after{background:var(--red)}
.gift-label{display:block;margin-top:18px;font:22px 'Patrick Hand'}

.confetti{position:fixed;top:-20px;width:10px;height:18px;z-index:20;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

.modal{position:fixed;inset:0;background:rgba(48,43,39,.62);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.25s;z-index:30}
.modal.open{opacity:1;pointer-events:auto}
.modal-card{
  background:var(--cream);border:4px solid var(--brown);border-radius:25px;
  box-shadow:10px 12px 0 var(--brown);padding:32px;max-width:450px;width:100%;
  animation:modalPop .35s cubic-bezier(.2,1.5,.4,1);
}
@keyframes modalPop{from{transform:scale(.65) rotate(-4deg)}to{transform:none}}
.modal-card h2{font:700 36px 'Bodoni Moda';color:var(--red);margin-top:0}
.close{border:3px solid var(--brown);background:var(--green);color:white;border-radius:12px;padding:10px 22px;font-weight:700;cursor:pointer}

@media(max-width:700px){
  .cake{height:350px}.tier1{height:110px}.tier2{height:90px;bottom:105px}.tier3{height:75px;bottom:180px}
  .candle-row{bottom:250px;gap:8px}.candle{width:14px;height:55px}
  .gifts{grid-template-columns:repeat(2,1fr)}.box{width:120px}
}
</style>
</head>
<body>
<main class="page">
  <div class="sticker">🎀 birthday edition</div>
  <h1>HAPPY BIRTHDAY!</h1>
  <p class="subtitle">Make a wish & blow out the candles ✨</p>

  <section class="cake-area">
    <div class="cake" id="cake">
      <div class="candle-row">
        <div class="candle"><span class="flame"></span></div>
        <div class="candle"><span class="flame"></span></div>
        <div class="candle"><span class="flame"></span></div>
        <div class="candle"><span class="flame"></span></div>
        <div class="candle"><span class="flame"></span></div>
        <div class="candle"><span class="flame"></span></div>
        <div class="candle"><span class="flame"></span></div>
      </div>
      <div class="tier tier3"></div><div class="tier tier2"></div><div class="tier tier1"></div>
    </div>
    <button class="blow-btn" id="blowBtn" type="button" onclick="blowCandles()">💨 BLOW</button>
    <div class="hint" id="hint">Tap BLOW to blow out the candles!</div>
  </section>

  <section class="gifts-section" id="giftsSection">
    <h2 class="gift-title">🎁 YOUR GIFTS 🎁</h2>
    <div class="gifts">
      <button class="gift" onclick="openGift(1)"><div class="box"><div class="bow"></div><div class="ribbon-v"></div><div class="ribbon-h"></div></div><span class="gift-label">Gift #1</span></button>
      <button class="gift" onclick="openGift(2)"><div class="box"><div class="bow"></div><div class="ribbon-v"></div><div class="ribbon-h"></div></div><span class="gift-label">Gift #2</span></button>
      <button class="gift" onclick="openGift(3)"><div class="box"><div class="bow"></div><div class="ribbon-v"></div><div class="ribbon-h"></div></div><span class="gift-label">Gift #3</span></button>
      <button class="gift" onclick="openGift(4)"><div class="box"><div class="bow"></div><div class="ribbon-v"></div><div class="ribbon-h"></div></div><span class="gift-label">Gift #4</span></button>
    </div>
  </section>
</main>

<div class="modal" id="modal" onclick="if(event.target===this)closeGift()">
  <div class="modal-card">
    <h2 id="modalTitle">🎁 Surprise!</h2>
    <p id="modalText" style="font-size:20px;line-height:1.6"></p>
    <button class="close" onclick="closeGift()">Close</button>
  </div>
</div>

<script>
const cake=document.getElementById('cake');
const btn=document.getElementById('blowBtn');
const hint=document.getElementById('hint');
const gifts=document.getElementById('giftsSection');

function blowCandles(){
  if(cake.classList.contains('blown')) return;

  // Turn every flame into a tiny puff, then extinguish it.
  cake.classList.add('blown');

  btn.textContent='✨ CANDLES BLOWN!';
  btn.disabled=true;
  hint.textContent='🎉 YAY! Now open your gifts!';

  // Small delay makes the gift section feel like the next scene.
  setTimeout(function(){
    gifts.classList.add('show');
  }, 350);

  // Retro confetti
  const pieces=['#D94F4F','#4F7C6B','#F2B84B','#E98EA5'];
  for(let i=0;i<70;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=pieces[Math.floor(Math.random()*pieces.length)];
    c.style.animationDelay=(Math.random()*0.7)+'s';
    c.style.transform='rotate('+(Math.random()*360)+'deg)';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3500);
  }
}

const titles=['','📸 A Little Memory','💌 A Little Message','🎵 A Little Something','🥹 The Final Surprise'];
const texts=['','Your first gift can reveal a photo or a special memory.','Your second gift can reveal your personal birthday message.','Your third gift can reveal a song, video, or another surprise.','Your fourth gift can be the BIG final surprise!'];
function openGift(n){
  document.getElementById('modalTitle').textContent=titles[n];
  document.getElementById('modalText').textContent=texts[n];
  document.getElementById('modal').classList.add('open');
}
function closeGift(){document.getElementById('modal').classList.remove('open')}
</script>
</body>
</html>
