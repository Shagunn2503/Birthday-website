<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎂</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@600;700&family=DM+Sans:wght@500;700&display=swap');

:root{
  --cream:#fff8ed;
  --red:#d94f6f;
  --green:#4f7c68;
  --yellow:#f2c84b;
  --pink:#e98ea5;
  --brown:#302b27;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:var(--brown);
  font-family:'DM Sans',sans-serif;
  background-color:var(--cream);
  background-image:radial-gradient(#e9c98b 2px,transparent 2px);
  background-size:32px 32px;
  overflow-x:hidden;
}
.page{
  min-height:100vh;
  display:none;
  padding:28px 18px 50px;
  text-align:center;
}
.page.active{display:block}
.badge{
  display:inline-block;
  padding:9px 18px;
  background:var(--yellow);
  border:3px solid var(--brown);
  border-radius:9px;
  box-shadow:4px 5px 0 var(--brown);
  font-weight:700;
  margin-bottom:15px;
}
h1{
  margin:5px 0 5px;
  font-family:'Bodoni Moda',serif;
  color:var(--red);
  font-size:clamp(48px,8vw,88px);
  line-height:1;
}
.subtitle{font-size:20px;margin:10px 0 25px}
.cake{
  position:relative;
  width:min(700px,90vw);
  height:360px;
  margin:35px auto 10px;
}
.tier{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  border:4px solid var(--brown);
  box-shadow:0 7px 0 rgba(48,43,39,.22);
}
.tier:before{
  content:"✦  •  ✦  •  ✦";
  position:absolute;
  width:100%;
  text-align:center;
  bottom:28px;
  font-size:23px;
  color:var(--brown);
}
.tier1{
  bottom:0;width:100%;height:135px;
  background:var(--yellow);border-radius:20px;
}
.tier2{
  bottom:108px;width:76%;height:115px;
  background:var(--pink);border-radius:18px;
}
.tier3{
  bottom:198px;width:52%;height:95px;
  background:#f7df91;border-radius:17px;
}
.top{
  position:absolute;top:-15px;left:0;width:100%;height:30px;
  background:#fff;border:4px solid var(--brown);border-radius:50%;
}
.candles{
  position:absolute;
  top:-82px;left:50%;
  transform:translateX(-50%);
  display:flex;gap:13px;align-items:flex-end;
}
.candle{
  position:relative;width:17px;height:72px;
  border:3px solid var(--brown);
  border-radius:6px;
  background:repeating-linear-gradient(-45deg,#fff 0 9px,#e96882 9px 18px);
}
.candle:nth-child(even){
  background:repeating-linear-gradient(-45deg,#fff 0 9px,#5e9b85 9px 18px);
}
.flame{
  position:absolute;left:50%;top:-29px;
  width:15px;height:24px;
  transform:translateX(-50%);
  background:#ffb62e;
  border:2px solid var(--brown);
  border-radius:50% 50% 50% 50%;
  animation:flicker .45s infinite alternate;
}
@keyframes flicker{
  from{transform:translateX(-50%) scale(.9) rotate(-3deg)}
  to{transform:translateX(-50%) scale(1.08) rotate(3deg)}
}
.candle.off .flame{
  display:none;
}
.smoke{
  position:absolute;left:50%;top:-32px;
  width:8px;height:25px;
  border-radius:50%;
  border-left:3px solid #aaa;
  opacity:0;
}
.candle.off .smoke{
  animation:smoke 1.5s ease-out forwards;
}
@keyframes smoke{
  0%{opacity:.7;transform:translate(-50%,10px) scale(.6)}
  100%{opacity:0;transform:translate(-50%,-35px) scale(1.4)}
}
button{
  border:3px solid var(--brown);
  background:var(--red);
  color:white;
  padding:15px 27px;
  border-radius:13px;
  font:700 18px 'DM Sans',sans-serif;
  cursor:pointer;
  box-shadow:4px 5px 0 var(--brown);
  transition:.15s;
}
button:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--brown)}
#openGifts{display:none;background:var(--green);margin-top:22px}
#message{min-height:28px;font-weight:700;margin:14px}
.bheemm-message{
  display:none;
  margin:18px auto 4px;
  font-family:'Bodoni Moda',serif;
  color:var(--red);
  font-size:clamp(30px,6vw,55px);
  line-height:1.05;
  animation:popIn .7s cubic-bezier(.2,1.5,.4,1) both;
}
.bheemm-message.show{display:block}
@keyframes popIn{
  0%{opacity:0;transform:scale(.5) rotate(-4deg)}
  70%{transform:scale(1.08) rotate(2deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}
.gifts{
  display:grid;
  grid-template-columns:repeat(2,minmax(120px,190px));
  justify-content:center;
  gap:28px;
  margin:45px auto;
}
.gift{
  position:relative;height:155px;
  cursor:pointer;
  transition:transform .25s;
}
.gift:hover{transform:translateY(-8px) rotate(-2deg)}
.box{
  position:absolute;bottom:0;left:10%;width:80%;height:105px;
  background:var(--pink);
  border:4px solid var(--brown);
  border-radius:8px;
  box-shadow:5px 6px 0 rgba(48,43,39,.2);
}
.lid{
  position:absolute;top:24px;left:4%;width:92%;height:35px;
  background:var(--red);
  border:4px solid var(--brown);
  border-radius:8px;
  z-index:2;
}
.ribbon-v{
  position:absolute;top:25px;left:43%;width:14%;height:100px;
  background:var(--yellow);border-left:3px solid var(--brown);border-right:3px solid var(--brown);
  z-index:3;
}
.ribbon-h{
  position:absolute;top:57px;left:10%;width:80%;height:18px;
  background:var(--yellow);z-index:4;
}
.bow{
  position:absolute;top:4px;left:50%;transform:translateX(-50%);
  font-size:40px;z-index:5;
}
.gift-note{font-size:18px;font-weight:700}
.back{background:var(--yellow);color:var(--brown);margin-top:15px}
.hidden{display:none!important}
.pop{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(48,43,39,.55);z-index:20;padding:20px;
}
.pop.show{display:flex}
.card{
  background:var(--cream);border:4px solid var(--brown);border-radius:20px;
  padding:30px;max-width:500px;box-shadow:8px 9px 0 var(--brown);
}
.card h2{color:var(--red);font-family:'Bodoni Moda',serif;font-size:35px}
.confetti{
  position:fixed;inset:0;pointer-events:none;z-index:30;
}
@media(max-width:500px){
  .cake{height:300px}
  .tier1{height:110px}.tier2{bottom:88px;height:95px}.tier3{bottom:164px;height:78px}
  .candles{top:-65px;gap:7px}.candle{height:58px;width:14px}
  .tier:before{bottom:20px;font-size:16px}
}
</style>
</head>
<body>

<section id="cakePage" class="page active">
  <div class="badge">🎀 birthday edition</div>
  <h1>HAPPY BIRTHDAY!</h1>
  <div class="subtitle">Make a wish & blow out the candles ✨</div>

  <div class="cake">
    <div class="tier tier1"><div class="top"></div></div>
    <div class="tier tier2"><div class="top"></div></div>
    <div class="tier tier3">
      <div class="top"></div>
      <div class="candles">
        <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
        <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
        <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
        <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
        <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
        <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
        <div class="candle"><div class="flame"></div><div class="smoke"></div></div>
      </div>
    </div>
  </div>

  <div id="message"></div>
  <div id="bheemmMessage" class="bheemm-message">HAPPY BIRTHDAY BHEEMM! 🎉💗</div>
  <button id="blow">💨 BLOW OUT THE CANDLES</button>
  <br>
  <button id="openGifts">🎁 YOUR GIFTS →</button>
</section>

<section id="giftPage" class="page">
  <div class="badge">🎁 just for you</div>
  <h1>YOUR GIFTS!</h1>
  <p class="subtitle">Four little surprises are waiting...</p>

  <div class="gifts">
    <div class="gift" data-title="Gift 1" data-text="A little surprise, just for you! 💌">
      <div class="bow">🎀</div><div class="lid"></div><div class="ribbon-v"></div><div class="ribbon-h"></div><div class="box"></div>
    </div>
    <div class="gift" data-title="Gift 2" data-text="Something to make you smile! ✨">
      <div class="bow">🎀</div><div class="lid"></div><div class="ribbon-v"></div><div class="ribbon-h"></div><div class="box"></div>
    </div>
    <div class="gift" data-title="Gift 3" data-text="Because you deserve the best! 🥳">
      <div class="bow">🎀</div><div class="lid"></div><div class="ribbon-v"></div><div class="ribbon-h"></div><div class="box"></div>
    </div>
    <div class="gift" data-title="Gift 4" data-text="And finally... a huge birthday hug! 🫶">
      <div class="bow">🎀</div><div class="lid"></div><div class="ribbon-v"></div><div class="ribbon-h"></div><div class="box"></div>
    </div>
  </div>

  <div class="gift-note">Tap a gift to open it 🎀</div>
  <button class="back" id="back">← Back to the cake</button>
</section>

<div class="pop" id="popup">
  <div class="card">
    <h2 id="popTitle">🎁</h2>
    <p id="popText"></p>
    <button id="close">Aww 🥹</button>
  </div>
</div>

<script>
const blow = document.getElementById('blow');
const openGifts = document.getElementById('openGifts');
const message = document.getElementById('message');

blow.addEventListener('click', () => {
  document.querySelectorAll('.candle').forEach((c,i) => {
    setTimeout(() => c.classList.add('off'), i * 80);
  });
  blow.disabled = true;
  blow.textContent = '✨ CANDLES BLOWN!';
  message.textContent = '🎉 HAPPYY BIRTHDAYY BHEEMM!';
  document.getElementById('bheemmMessage').classList.add('show');
  openGifts.style.display = 'inline-block';
});

openGifts.addEventListener('click', () => {
  document.getElementById('cakePage').classList.remove('active');
  document.getElementById('giftPage').classList.add('active');
  window.scrollTo(0,0);
});

document.getElementById('back').addEventListener('click', () => {
  document.getElementById('giftPage').classList.remove('active');
  document.getElementById('cakePage').classList.add('active');
  window.scrollTo(0,0);
});

const popup = document.getElementById('popup');

document.querySelectorAll('.gift').forEach(gift => {
  gift.addEventListener('click', () => {

    document.getElementById('popTitle').textContent =
      gift.dataset.title + ' 🎁';

    if (gift.dataset.title === 'Gift 1') {
    document.getElementById('popText').innerHTML = `
        <iframe
            src="https://drive.google.com/file/d/1VD4bBzU-ASqPC3BCmLgbnD8HwT0WIEb5/preview"
            width="100%"
            height="600"
            allow="autoplay">
        </iframe>
    `;
    } else {
      document.getElementById('popText').textContent =
        gift.dataset.text;
    }

    popup.classList.add('show');
  });
});
document.getElementById('close').addEventListener('click',()=>popup.classList.remove('show'));
popup.addEventListener('click',e=>{if(e.target===popup)popup.classList.remove('show')});
</script>
</body>
</html>
